<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DOON Riders Technician</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0A0F1D;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top, 12px);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 4px;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.3px;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-text span {
      color: #00D96B;
    }

    .brand-sub {
      font-size: 10px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #F87171;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #EF4444;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .main-card {
      width: 100%;
      max-width: 400px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin: auto 0;
    }

    .icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-bg {
      position: absolute;
      inset: 0;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      animation: gentle-pulse 3s infinite ease-in-out;
    }

    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 0.6; }
    }

    .wifi-icon {
      position: relative;
      width: 38px;
      height: 38px;
      color: #FBBF24;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .description {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .retry-btn {
      width: 100%;
      background: #00D96B;
      color: #0A0F1D;
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 217, 107, 0.25);
      transition: all 0.2s ease;
    }

    .retry-btn:active {
      transform: scale(0.97);
      background: #00BF5E;
    }

    .retry-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid #0A0F1D;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .retry-btn.loading .btn-text, .retry-btn.loading .btn-icon {
      display: none;
    }

    .retry-btn.loading .btn-spinner {
      display: inline-block;
    }

    .status-hint {
      margin-top: 14px;
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding-bottom: env(safe-area-inset-bottom, 8px);
      font-size: 11px;
      color: #475569;
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="images/doon-riders-logo.png" alt="DOON Riders" class="logo-img" onerror="this.style.display='none'" />
      <div>
        <div class="brand-text">DOON<span>RIDERS</span></div>
        <div class="brand-sub">Technician Workshop</div>
      </div>
    </div>
    <div class="offline-badge">
      <span class="badge-dot"></span>
      <span>Offline</span>
    </div>
  </header>

  <main class="main-card" id="card">
    <div class="icon-wrapper">
      <div class="icon-bg"></div>
      <svg class="wifi-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-linecap="round"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" stroke="currentColor" stroke-linecap="round"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" stroke="currentColor" stroke-linecap="round"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" stroke="currentColor" stroke-linecap="round"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" stroke="currentColor" stroke-linecap="round"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" stroke="currentColor" stroke-linecap="round"/>
        <line x1="12" y1="20" x2="12.01" y2="20" stroke="currentColor" stroke-linecap="round" stroke-width="3"/>
      </svg>
    </div>

    <h1 class="title">No Internet Connection</h1>
    <p class="description">
      Unable to reach DOON Riders servers. Please check your mobile data or Wi-Fi network and tap below to retry.
    </p>

    <button class="retry-btn" id="retryBtn" onclick="attemptReconnect()">
      <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span class="btn-text">Retry Connection</span>
      <span class="btn-spinner"></span>
    </button>

    <div class="status-hint" id="statusHint">
      <span>Auto-reconnecting when network is restored...</span>
    </div>
  </main>

  <footer class="footer">
    <span>DOON Riders EV Mobility &bull; Smart Workshop Portal</span>
  </footer>

  <script>
    const APP_URL = 'https://doon-riders.vercel.app/technician/login';

    function attemptReconnect() {
      const btn = document.getElementById('retryBtn');
      const hint = document.getElementById('statusHint');
      const card = document.getElementById('card');

      btn.classList.add('loading');
      btn.disabled = true;
      hint.innerText = 'Checking network connectivity...';

      fetch('https://doon-riders.vercel.app/api/health', {
        method: 'GET',
        cache: 'no-store',
        mode: 'no-cors'
      })
      .then(() => {
        hint.innerText = 'Connected! Loading DOON Riders...';
        setTimeout(() => {
          window.location.href = APP_URL;
        }, 300);
      })
      .catch(() => {
        if (navigator.onLine) {
          window.location.href = APP_URL;
          return;
        }

        setTimeout(() => {
          btn.classList.remove('loading');
          btn.disabled = false;
          hint.innerText = 'Network still unavailable. Please check settings.';
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);
        }, 700);
      });
    }

    // Auto-attempt redirect if already online
    if (navigator.onLine) {
      setTimeout(() => attemptReconnect(), 100);
    }

    window.addEventListener('online', () => {
      attemptReconnect();
    });

    setInterval(() => {
      if (navigator.onLine) {
        attemptReconnect();
      }
    }, 5000);
  </script>
</body>
</html>
