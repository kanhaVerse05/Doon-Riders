version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doon_riders_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres.wixelkxnvvwntgiptnqu:Synbroly%408285@aws-0-ap-south-1.pooler.supabase.com:5432/postgres}
      JWT_SECRET: ${JWT_SECRET:-doon_riders_production_jwt_secret_2026}
      CLIENT_URL: ${CLIENT_URL:-*}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doon_riders_frontend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:5000
      BACKEND_URL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_uploads:
